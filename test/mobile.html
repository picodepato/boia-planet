<!doctype html><html lang="es"><meta charset="utf-8"><title>BOIA — Responsive check</title>
<style>body{background:#e0e5e7;margin:20px;font:16px Arial}nav{margin-bottom:16px}button{font:inherit;padding:10px;margin-right:8px}iframe{width:390px;height:844px;display:block;border:0;background:#062a42}</style>
<nav><button data-width="390">390 px</button><button data-width="320">320 px</button><button data-width="768">768 px</button></nav>
<iframe title="BOIA móvil" src="/"></iframe>
<script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>document.querySelector('iframe').style.width=b.dataset.width+'px');</script></html>
